name: Cross-architecture benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/cross-architecture-benchmarks.yml"
      - "scripts/benchmark_wasm_browser.mjs"
      - "scripts/build_wasm.sh"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cross-architecture-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-${{ matrix.arch }}

      - name: Record platform
        run: |
          uname -a
          rustc -vV

      - name: Benchmark representative workloads
        env:
          BENCH_FAST_CI: "1"
        run: cargo bench -p geo-polygonize-core --bench polygonize_bench -- 'polygonize/(grid/100|random/(100|200))' --noplot | tee native-${{ matrix.arch }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}-benchmarks
          path: |
            native-${{ matrix.arch }}.txt
            target/criterion/
          retention-days: 30

  wasm:
    name: Wasm (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: scalar
            threads: 1
          - variant: threads
            threads: 2
          - variant: threads
            threads: 4
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        if: matrix.variant == 'scalar'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up nightly Rust
        if: matrix.variant == 'threads'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-wasm-${{ matrix.variant }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: cargo-bins/cargo-binstall@main

      - name: Build release package
        run: ./scripts/build_wasm.sh --variant "${{ matrix.variant }}" --no-bundle

      - name: Benchmark in cross-origin-isolated Chrome
        run: |
          set -o pipefail
          node scripts/benchmark_wasm_browser.mjs "${{ matrix.variant }}" "${{ matrix.threads }}" | tee wasm-${{ matrix.variant }}-${{ matrix.threads }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.variant }}-${{ matrix.threads }}-benchmarks
          path: wasm-${{ matrix.variant }}-${{ matrix.threads }}.json
          retention-days: 30
