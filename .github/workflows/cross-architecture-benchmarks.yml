name: Cross-architecture benchmarks

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "geo-polygonize-v*"
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/cross-architecture-benchmarks.yml"
      - "scripts/benchmark_wasm_browser.mjs"
      - "scripts/build_wasm.sh"
      - "crates/geo-polygonize-core/benches/polygonize_bench.rs"
      - "crates/geo-polygonize-core/benches/hole_sort_bench.rs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cross-architecture-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-${{ matrix.arch }}

      - name: Record platform
        run: |
          uname -a
          rustc -vV

      - name: Benchmark representative workloads
        env:
          BENCH_FAST_CI: "1"
        run: |
          set -o pipefail
          cargo bench --locked -p geo-polygonize-core --bench polygonize_bench -- 'polygonize/(grid/100|random/(100|200))' --noplot | tee native-${{ matrix.arch }}.txt
          cargo bench --locked -p geo-polygonize-core --bench polygonize_bench -- noding_workloads --noplot | tee native-${{ matrix.arch }}-noding.txt
          cargo bench --locked -p geo-polygonize-core --bench hole_sort_bench -- point_in_ring_crossover --noplot --warm-up-time 1 --measurement-time 2 --sample-size 30 | tee native-${{ matrix.arch }}-point-in-ring.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}-benchmarks
          path: |
            native-${{ matrix.arch }}.txt
            native-${{ matrix.arch }}-noding.txt
            native-${{ matrix.arch }}-point-in-ring.txt
            target/criterion/
          retention-days: 30

  wasm:
    name: Wasm crossover
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2026-07-15"
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-wasm-crossover

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm

      - run: npm ci

      - name: Build and benchmark scalar package
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh --variant scalar --no-bundle
          node scripts/benchmark_wasm_browser.mjs scalar 1 | tee wasm-scalar-1.json

      - name: Build and benchmark threaded package
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh --variant threads --no-bundle
          node scripts/benchmark_wasm_browser.mjs threads 2 | tee wasm-threads-2.json
          node scripts/benchmark_wasm_browser.mjs threads 4 | tee wasm-threads-4.json

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-crossover-benchmarks
          path: wasm-*.json
          retention-days: 30

  attach-to-release:
    name: Attach results to release
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download benchmark results
        if: needs.native.result == 'success' && needs.wasm.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: "*-benchmarks"
          path: benchmark-results

      - name: Attach benchmark results
        if: needs.native.result == 'success' && needs.wasm.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -qr "benchmark-results-${TAG}.zip" benchmark-results
          gh release upload "$TAG" "benchmark-results-${TAG}.zip" --repo "$REPOSITORY" --clobber

      - name: Add package and benchmark links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#geo-polygonize-v}"
          version="${version#v}"
          gh release view "$TAG" --json body --jq .body > release-body.md
          sed '/<!-- release-links:start -->/,/<!-- release-links:end -->/d' release-body.md > release-body.next.md
          {
            cat release-body.next.md
            printf '\n<!-- release-links:start -->\n## Packages\n\n'
            printf '| Package | Release |\n|---|---|\n'
            printf '| npm | [geo-polygonize %s](https://www.npmjs.com/package/geo-polygonize/v/%s) |\n' "$version" "$version"
            printf '| PyPI | [geo-polygonize-py %s](https://pypi.org/project/geo-polygonize-py/%s/) |\n' "$version" "$version"
            for package in geo-polygonize-core geo-polygonize-arrow geo-polygonize-flatgeobuf geo-polygonize-wasm; do
              printf '| crates.io | [%s %s](https://crates.io/crates/%s/%s) |\n' "$package" "$version" "$package" "$version"
            done
            if [ -f "benchmark-results-${TAG}.zip" ]; then
              printf '| Benchmarks | [Cross-architecture results](https://github.com/%s/releases/download/%s/benchmark-results-%s.zip) |\n' "$REPOSITORY" "$TAG" "$TAG"
            fi
            printf '<!-- release-links:end -->\n'
          } > release-body.updated.md
          gh release edit "$TAG" --notes-file release-body.updated.md
