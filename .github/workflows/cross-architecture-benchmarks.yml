name: Cross-architecture benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/cross-architecture-benchmarks.yml"
      - "scripts/benchmark_wasm_browser.mjs"
      - "scripts/build_wasm.sh"
      - "crates/geo-polygonize-core/benches/hole_sort_bench.rs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: cross-architecture-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-${{ matrix.arch }}

      - name: Record platform
        run: |
          uname -a
          rustc -vV

      - name: Benchmark representative workloads
        env:
          BENCH_FAST_CI: "1"
        run: |
          set -o pipefail
          cargo bench -p geo-polygonize-core --bench polygonize_bench -- 'polygonize/(grid/100|random/(100|200))' --noplot | tee native-${{ matrix.arch }}.txt
          cargo bench -p geo-polygonize-core --bench hole_sort_bench -- point_in_ring_crossover --noplot --warm-up-time 1 --measurement-time 2 --sample-size 30 | tee native-${{ matrix.arch }}-point-in-ring.txt

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}-benchmarks
          path: |
            native-${{ matrix.arch }}.txt
            native-${{ matrix.arch }}-point-in-ring.txt
            target/criterion/
          retention-days: 30

  wasm:
    name: Wasm crossover
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark-wasm-crossover

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - uses: cargo-bins/cargo-binstall@main

      - name: Build and benchmark scalar package
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh --variant scalar --no-bundle
          node scripts/benchmark_wasm_browser.mjs scalar 1 | tee wasm-scalar-1.json

      - name: Build and benchmark threaded package
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh --variant threads --no-bundle
          node scripts/benchmark_wasm_browser.mjs threads 2 | tee wasm-threads-2.json
          node scripts/benchmark_wasm_browser.mjs threads 4 | tee wasm-threads-4.json

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-crossover-benchmarks
          path: wasm-*.json
          retention-days: 30
