name: Differential Fuzzer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/python-tests.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/geo-polygonize-core/Cargo.toml"
      - "crates/geo-polygonize-core/src/**"
      - "tests/differential_shapely.py"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/python-tests.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/geo-polygonize-core/Cargo.toml"
      - "crates/geo-polygonize-core/src/**"
      - "tests/differential_shapely.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: rust-release
        workspaces: |
          . -> target

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest shapely numpy

    - name: Build Rust CLI for Differential Fuzzer
      run: cargo build --release --locked -p geo-polygonize-core --example polygonize

    - name: Run Pytest Differential Harness
      run: pytest tests/differential_shapely.py -v
