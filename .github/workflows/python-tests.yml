name: Differential Fuzzer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest shapely numpy

    - name: Build Rust CLI for Differential Fuzzer
      run: cargo build --release --locked -p geo-polygonize-core --example polygonize

    - name: Run Pytest Differential Harness
      run: pytest tests/differential_shapely.py -v
