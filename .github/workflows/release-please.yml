on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GH_PAT }}
          release-type: node
          package-name: "geo-polygonize"
          extra-files: |
            pyproject.toml
            crates/geo-polygonize-core/Cargo.toml
            crates/geo-polygonize-wasm/Cargo.toml
