name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect changed paths
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          fi

          if echo "$changed" | grep -Eq '^(crates/|fixtures/cfb/|pkg-wrapper/|playground/|scripts/build_wasm\.sh$|package(-lock)?\.json$|rollup\.config\.mjs$|tsconfig\.json$|\.github/workflows/ci\.yml$)'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -Eq '^(Cargo\.(toml|lock)$|pyproject\.toml$|python/|crates/geo-polygonize-(core|python)/|\.github/workflows/ci\.yml$)'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-debug
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check Cargo.lock
        run: cargo check --locked

      - name: Lint with Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Verify supported core feature combinations
        run: |
          cargo test --locked -p geo-polygonize-core --no-default-features --lib --tests
          cargo check --locked -p geo-polygonize-core --all-targets --all-features

  msrv:
    name: MSRV (Rust 1.87.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.87.0
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Check workspace at the MSRV
        run: cargo check --locked --workspace --all-targets

  python-abi-build:
    name: Python abi3 wheel
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: python-abi
          workspaces: |
            . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --out dist

      - name: Upload abi3 wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-abi3-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3

  python-abi:
    name: Python ABI (${{ matrix.python-version }})
    needs: [changes, python-abi-build]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.x']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: python-abi3-wheel
          path: dist

      - name: Install abi3 wheel
        run: python -m pip install dist/*.whl

      - name: Verify native ABI import
        run: |
          python - <<'PY'
          import geo_polygonize
          from geo_polygonize.geo_polygonize_core import polygonize_with_options

          ok, error = geo_polygonize.import_probe()
          assert ok, error
          assert callable(polygonize_with_options)
          PY

  release-tests:
    name: Release Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-release

      - name: Run release tests
        run: |
          cargo test --release --locked -p geo-polygonize-core --test robustness --test regression_nan_panic
          cargo test --release --locked -p geo-polygonize-arrow --test test_ffi_errors

  release-contract:
    name: Release Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release versions
        run: ./scripts/check-release-versions.sh

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              rustup default stable
              exit 0
            fi
            echo "Rust toolchain download failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 30))
          done
          exit 1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-supply
          workspaces: |
            . -> target

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0020 --ignore RUSTSEC-2026-0173

  wasm-build:
    name: WASM (${{ matrix.variant }})
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [scalar, simd, threads]
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        if: matrix.variant != 'threads'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up nightly Rust
        if: matrix.variant == 'threads'
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2026-07-15"
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Verify WASM panic strategy
        run: rustc --print cfg --target wasm32-unknown-unknown | grep -Fx 'panic="abort"'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-${{ matrix.variant }}
          workspaces: |
            . -> target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build WASM package
        env:
          THREADS_TOOLCHAIN: nightly-2026-07-15
        run: ./scripts/build_wasm.sh --variant "${{ matrix.variant }}" --no-bundle

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg-${{ matrix.variant }}
          path: pkg-${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 3

  js:
    name: JS
    needs: [changes, wasm-build]
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - name: Install NPM dependencies
        run: |
          npm ci
          npm ci --prefix playground

      - name: Download scalar package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-scalar
          path: pkg-scalar

      - name: Download SIMD package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-simd
          path: pkg-simd

      - name: Download threads package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-threads
          path: pkg-threads

      - name: Bundle package
        run: ./scripts/build_wasm.sh --bundle-only

      - name: Run JS Tests
        run: npm test

      - name: Build playground
        run: npm run build --prefix playground

  test:
    name: CI Required
    needs: [changes, rust, msrv, python-abi-build, python-abi, release-tests, release-contract, supply-chain, wasm-build, js]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          [ "${{ needs.changes.result }}" = "success" ]
          [ "${{ needs.rust.result }}" = "success" ]
          [ "${{ needs.msrv.result }}" = "success" ]
          [[ "${{ needs.python-abi-build.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.python-abi.result }}" =~ ^(success|skipped)$ ]]
          [ "${{ needs.release-tests.result }}" = "success" ]
          [ "${{ needs.release-contract.result }}" = "success" ]
          [ "${{ needs.supply-chain.result }}" = "success" ]
          [[ "${{ needs.wasm-build.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.js.result }}" =~ ^(success|skipped)$ ]]
