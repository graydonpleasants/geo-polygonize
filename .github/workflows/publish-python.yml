name: Publish Python Package

on:
  push:
    tags:
      - "v*"

jobs:
  publish-python:
    name: Publish Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build and Publish Wheels
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: --release
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
