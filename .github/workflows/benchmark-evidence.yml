name: Benchmark Evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/benchmark-evidence.yml"
      - "benchmarks/**"
      - "crates/geo-polygonize-core/examples/benchmark_record.rs"
      - "crates/geo-polygonize-core/tests/workloads/**"
      - "tests/test_reference_geos.py"
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "crates/geo-polygonize-core/examples/benchmark_record.rs"
      - "crates/geo-polygonize-core/tests/workloads/**"
      - "tests/test_reference_geos.py"

permissions:
  contents: read

jobs:
  geos-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: benchmarks/reference-requirements.txt

      - run: python -m pip install -r benchmarks/reference-requirements.txt

      - run: cargo build --locked --release -p geo-polygonize-core --example benchmark_record

      - run: pytest -q tests/test_reference_geos.py

      - run: python benchmarks/check_geos_references.py
