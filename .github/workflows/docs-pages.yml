name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playground/package.json'
      - 'playground/package-lock.json'
      - 'crates/geo-polygonize-core/**'
      - 'crates/geo-polygonize-wasm/**'
      - 'python/**'
      - 'docs/**'
      - 'scripts/build_wasm.sh'
      - 'scripts/docs/**'
      - 'xtask/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep production deployments serialized while allowing independent PR builds and canceling stale PR runs.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2026-07-15"
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          workspaces: |
            . -> target

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Docs Metadata
        run: npm run docs:gen

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md docs
          fail: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Build Site Wasm Library
        run: npm run build:site-lib
        env:
          SKIP_SIMD: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Build Docs Site
        run: npx vitepress build docs

      - name: Build Playground
        run: |
          cd playground
          npm ci
          npm run build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build_docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
