name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/docs-pages.yml'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'playground/package.json'
      - 'playground/package-lock.json'
      - 'crates/geo-polygonize-core/**'
      - 'crates/geo-polygonize-wasm/**'
      - 'python/**'
      - 'docs/**'
      - 'scripts/build_wasm.sh'
      - 'scripts/docs/**'
      - 'xtask/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep production deployments serialized while allowing independent PR builds and canceling stale PR runs.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2026-07-15"
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          workspaces: |
            . -> target

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Docs Metadata
        run: npm run docs:gen

      - name: Install Lychee
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          filename="lychee-${arch}-unknown-linux-gnu.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${filename}"
          install_dir="${RUNNER_TEMP}/lychee"
          mkdir -p "${install_dir}"
          for attempt in 1 2 3 4 5; do
            echo "Downloading Lychee (attempt ${attempt}/5)"
            if curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
              --output "${install_dir}/${filename}" "${url}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Lychee download failed after ${attempt} attempts" >&2
              exit 1
            fi
            rm -f "${install_dir}/${filename}"
            sleep 2
          done
          tar -xzf "${install_dir}/${filename}" -C "${install_dir}"
          lychee_bin="${install_dir}/lychee-${arch}-unknown-linux-gnu/lychee"
          test -x "${lychee_bin}"
          dirname "${lychee_bin}" >> "${GITHUB_PATH}"

      - name: Check documentation links
        run: lychee --no-progress README.md docs

      - name: Build Site Wasm Library
        run: npm run build:site-lib
        env:
          SKIP_SIMD: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Build Docs Site
        run: npx vitepress build docs

      - name: Build Playground
        run: |
          cd playground
          npm ci
          npm run build

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build_docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
