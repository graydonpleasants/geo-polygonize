name: Maintenance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/maintenance.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  maintenance:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.1'

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: maintenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install Shapely==2.1.2 numpy==2.3.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: 'npm'

      - name: Install Wasm tools
        run: npm install -g wasm-pack@0.13.1

      - name: Run Benchmarks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash crates/geo-polygonize-core/benches/run_comparison.sh --fast-ci
          else
            bash crates/geo-polygonize-core/benches/run_comparison.sh
          fi

      - name: Generate Benchmark Report
        run: python3 crates/geo-polygonize-core/benches/compare_results.py > benchmark_report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('benchmark_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file benchmark_report.md

      - name: Add report to workflow summary
        if: github.event_name == 'workflow_dispatch'
        run: cat benchmark_report.md >> "$GITHUB_STEP_SUMMARY"
