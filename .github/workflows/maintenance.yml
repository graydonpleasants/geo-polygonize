name: Maintenance

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install shapely numpy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wasm tools
        run: |
          npm install -g wasm-pack

      - name: Run Benchmarks
        run: |
          bash crates/geo-polygonize-core/benches/run_comparison.sh

      - name: Update BENCHMARKS.md
        if: github.event_name == 'push'
        run: |
          python3 crates/geo-polygonize-core/benches/compare_results.py --update

      - name: Generate llms.txt
        if: github.event_name == 'push'
        run: python3 scripts/generate_llms_txt.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md llms.txt
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "chore(github): Update benchmarks and llms.txt [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Generate Benchmark Report
        if: github.event_name == 'pull_request'
        run: |
          python3 crates/geo-polygonize-core/benches/compare_results.py > benchmark_report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file benchmark_report.md
