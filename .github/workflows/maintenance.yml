name: Maintenance

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install shapely numpy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wasm tools
        run: |
          npm install -g wasm-pack

      - name: Run Benchmarks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash crates/geo-polygonize-core/benches/run_comparison.sh --fast-ci
          else
            bash crates/geo-polygonize-core/benches/run_comparison.sh
          fi

      - name: Update BENCHMARKS.md
        if: github.event_name == 'push'
        run: |
          python3 crates/geo-polygonize-core/benches/compare_results.py --update

      - name: Generate llms.txt
        if: github.event_name == 'push'
        run: python3 scripts/generate_llms_txt.py

      - name: Create Pull Request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore(github): Update benchmarks and llms.txt"
          title: "chore(github): Update benchmarks and llms.txt"
          body: "Automated updates to benchmarks and llms.txt."
          branch: update-benchmarks-llms
          base: ${{ github.ref_name }}
          add-paths: |
            BENCHMARKS.md
            llms.txt

      - name: Generate Benchmark Report
        if: github.event_name == 'pull_request'
        run: |
          python3 crates/geo-polygonize-core/benches/compare_results.py > benchmark_report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file benchmark_report.md
