name: Maintenance

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/maintenance.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/maintenance.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(github): update benchmarks') }}"
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: maintenance

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install shapely numpy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Wasm tools
        run: npm install -g wasm-pack

      - name: Run Benchmarks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash crates/geo-polygonize-core/benches/run_comparison.sh --fast-ci
          else
            bash crates/geo-polygonize-core/benches/run_comparison.sh
          fi

      - name: Update BENCHMARKS.md
        if: github.event_name == 'push'
        run: python3 crates/geo-polygonize-core/benches/compare_results.py --update

      - name: Create Pull Request
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore(github): update benchmarks"
          title: "chore(github): update benchmarks"
          body: "Automated benchmark updates."
          branch: update-benchmarks
          base: ${{ github.ref_name }}
          add-paths: BENCHMARKS.md

      - name: Generate Benchmark Report
        if: github.event_name == 'pull_request'
        run: python3 crates/geo-polygonize-core/benches/compare_results.py > benchmark_report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('benchmark_report.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file benchmark_report.md
