name: Enable automerge

"on":
  pull_request_target:

jobs:
  automerge:
    name: Enable automerge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable automerge
        if: ${{ github.actor == 'graydonpleasants' }}
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
