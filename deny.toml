[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [ "RUSTSEC-2025-0141", "RUSTSEC-2024-0436", "RUSTSEC-2026-0097",]

[licenses]
allow = [ "MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Zlib", "Apache-2.0 WITH LLVM-exception", "CC0-1.0",]
confidence-threshold = 0.8
[[licenses.exceptions]]
allow = [ "Zlib", "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause",]
name = "zerocopy"

[[licenses.exceptions]]
allow = [ "Zlib", "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause",]
name = "zerocopy-derive"

[[licenses.exceptions]]
allow = [ "MIT", "Unicode-3.0", "Apache-2.0",]
name = "unicode-ident"

[[licenses.exceptions]]
allow = [ "MIT",]
name = "zmij"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip-tree = []
[[bans.skip]]
crate = "thiserror@1.0.69"

[[bans.skip]]
crate = "thiserror-impl@1.0.69"

[[bans.skip]]
crate = "hashbrown@0.15.5"

[[bans.skip]]
crate = "getrandom@0.2.17"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = [ "https://github.com/rust-lang/crates.io-index",]
allow-git = []

[licenses.private]
ignore = false
registries = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
