[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "geo-polygonize-py"
version = "0.17.4"
requires-python = ">=3.7"
description = "Python bindings for geo-polygonize-core, a native Rust port of the JTS/GEOS polygonization algorithm."
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["numpy", "cffi"]

[tool.maturin]
python-source = "python"
manifest-path = "crates/geo-polygonize-core/Cargo.toml"
module-name = "geo_polygonize.geo_polygonize_core"
features = ["python"]
